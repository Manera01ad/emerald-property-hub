# gitleaks configuration for PropWise AI.
#
# Purpose: keep failing the build on NEW secrets, while recording — not hiding —
# the findings that already exist in this repository's history.
#
# There are two kinds of historical finding, and they are handled differently.
#
# 1. The Google Maps browser key is a REAL credential. It was committed in
#    `.env` in two commits from October 2026:
#
#      aa15b43  .env line 4  gcp-api-key  VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY
#      9375300  .env line 4  gcp-api-key  VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY
#
#    `.env` has since been untracked, so no current commit contains it, but it
#    stays readable in history. Removing it would mean rewriting history, which
#    destroys the Lovable project history, so it is acknowledged here by commit
#    instead of removed.
#
#    ACTION REQUIRED: rotate this key in Google Cloud Console, restrict it to
#    the PropWise domains, then delete its two entries below.
#
# 2. Supabase PUBLISHABLE keys are sent to browsers by design; protection comes
#    from row-level security, not from secrecy. They appear in `.env` (several
#    October 2026 commits) and in the public build fallback in `vite.config.ts`.
#    They are matched by the `sb_publishable_` pattern below rather than by
#    commit, so the same value does not need a new entry each time it moves.
#
# A service-role key (`sb_secret_`), the Maps key, or any other credential is
# NOT matched by that pattern, so committing one still fails the scan.
#
# NOTE: the allowlist must use the singular [allowlist] form. The plural
# [[allowlists]] form parses without error but is silently not applied, which
# leaves the scheduled scan failing.

[extend]
useDefault = true

[allowlist]
description = "Historical Maps browser key (a real credential — rotate it) plus Supabase publishable keys, which are public by design. A newly committed credential still fails the scan."
commits = [
  "aa15b4316f9873656aa0e4c3ab68b28974bf8b17",
  "9375300fecd46b6294b3403d5c8f9a81d8a463e1",
]
regexes = [
  '''sb_publishable_[A-Za-z0-9_-]{20,}''',
]
